[project]
name = "systui"
version = "0.1.0"
description = "Live motherboard- and GPU-PCB terminal views of this machine"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "parag", email = "12007367+PCIHD@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "nvidia-ml-py>=13.615.71",
    "psutil>=7.2.2",
    "rich>=15.0.0",
    "textual>=8.2.8",
]

[project.scripts]
systui = "systui:main"
gputui = "gputui:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
