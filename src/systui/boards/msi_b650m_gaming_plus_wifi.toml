# MSI B650M GAMING PLUS WIFI (MS-7E24), Micro-ATX 243 × 243 mm.
# Positions measured from the manual's "Übersicht der Komponenten" figure (p.27, 300 dpi
# render, board outline = 0..100 %). Parts the figure does not draw (VRM chokes and
# heatsinks, ICs under the I/O cover, chipset heatsink outline) are marked conf = "inferred".

[board]
name = "MSI B650M GAMING PLUS WIFI"
short = "MSI B650M GAMING PLUS WIFI (MS-7E24)"
vendor = "MSI"
match = ["B650M GAMING PLUS WIFI", "MS-7E24"]
form = "Micro-ATX"
pcb_mm = [243, 243]
socket = "AM5 (LGA1718)"
chipset = "AMD B650 (Promontory 21)"
superio = "Nuvoton NCT6687-R"
vrm = "8+2+1 phases (Vcore + SoC + Misc)"
sources = [
  "https://download-2.msi.com/archive/mnu_exe/mb/B650MGAMINGPLUSWIFI_DE.pdf (layout p.27, spec p.17-20)",
]
notes = [
  "M2_1 and M2_2 are both CPU-attached PCIe 4.0 x4; the slot→root-port mapping is inferred.",
  "DIMM slot ↔ SPD address (0x50..0x53 → A1, A2, B1, B2) follows the usual AM5 convention.",
  "nct6687 fan labels are mapped to headers in driver order (CPU, Pump, SYS1..SYS6).",
]
holes = [[15.3, 3.4], [55.0, 3.4], [96.6, 3.6], [96.6, 61.0], [15.3, 93.6], [96.6, 93.6]]

# ----------------------------------------------------------------------------- CPU + VRM
[[component]]
id = "CPU"
kind = "socket"
rect = [40.3, 23.2, 63.1, 50.9]
label = "AM5"
part = "AM5 LGA1718 socket"

[[component]]
id = "HS_L"
kind = "heatsink"
rect = [16.0, 7.6, 29.6, 46.5]
label = "VRM"
part = "VRM heatsink (Vcore stages)"
rail = "Vcore"
conf = "inferred"

[[component]]
id = "HS_T"
kind = "heatsink"
rect = [33.2, 6.6, 66.0, 14.2]
label = "VRM"
part = "VRM heatsink (Vcore / SoC stages)"
rail = "Vcore"
conf = "inferred"

[[component]]
id = "L"
kind = "choke"
rect = [31.0, 19.5, 35.6, 51.0]
n = 6
axis = "y"
gap = 0.6
rail = "Vcore"
part = "R22 choke"
conf = "inferred"

[[component]]
id = "LT"
kind = "choke"
rect = [42.6, 14.6, 61.4, 17.2]
n = 5
axis = "x"
gap = 0.7
rails = ["Vcore", "Vcore", "VSOC", "VSOC", "VMISC"]
part = "R22 choke"
conf = "inferred"

[[component]]
id = "PWM"
kind = "chip"
rect = [31.4, 52.4, 34.6, 55.6]
label = "PWM"
part = "Multi-phase PWM controller"
conf = "inferred"

[[component]]
id = "CPU_PWR1"
kind = "power"
rect = [17.1, 0.7, 24.1, 5.3]
pins = 8
label = "CPU_PWR1"
part = "8-pin EPS +12V"

[[component]]
id = "CPU_PWR2"
kind = "power"
rect = [24.5, 0.7, 31.6, 5.3]
pins = 8
label = "CPU_PWR2"
part = "8-pin EPS +12V"

[[component]]
id = "ATX_PWR1"
kind = "power"
rect = [95.2, 25.4, 99.4, 46.0]
pins = 24
label = "ATX_PWR1"
part = "24-pin ATX"

# ----------------------------------------------------------------------------- memory
[[component]]
id = "DIMM"
kind = "dimm"
rect = [73.7, 8.7, 88.0, 65.9]
n = 4
axis = "x"
gap = 0.9
ids = ["DIMMA1", "DIMMA2", "DIMMB1", "DIMMB2"]
labels = ["A1", "A2", "B1", "B2"]
binds = ["dimm:0x50", "dimm:0x51", "dimm:0x52", "dimm:0x53"]
part = "DDR5 UDIMM slot"

# ----------------------------------------------------------------------------- expansion
[[component]]
id = "PCI_E1"
kind = "pcie"
rect = [18.2, 64.4, 28.1, 67.1]
lanes = 1
source = "chipset"
label = "PCI_E1"
part = "PCIe 3.0 x1 (B650)"
bind = "temp:PCIe x1"

[[component]]
id = "PCI_E2"
kind = "pcie"
rect = [18.2, 73.0, 60.0, 76.4]
lanes = 16
source = "cpu"
label = "PCI_E2"
part = "PCIe 4.0 x16 (CPU), steel armor"
bind = "gpu:x16"

[[component]]
id = "PCI_E3"
kind = "pcie"
rect = [18.2, 89.3, 28.1, 92.1]
lanes = 1
source = "chipset"
label = "PCI_E3"
part = "PCIe 3.0 x1 (B650)"

[[component]]
id = "M2_1"
kind = "m2"
rect = [29.4, 61.6, 65.0, 70.2]
lanes = 4
source = "cpu"
label = "M2_1"
part = "M.2 2260/2280, PCIe 4.0 x4 (CPU)"
bind = "nvme:0000:00:01.2"
shield = true

[[component]]
id = "M2_2"
kind = "m2"
rect = [30.5, 78.4, 66.0, 87.4]
lanes = 4
source = "cpu"
label = "M2_2"
part = "M.2 2260/2280, PCIe 4.0 x4 (CPU)"
bind = "nvme:0000:00:02.2"

# ----------------------------------------------------------------------------- chipset + storage
[[component]]
id = "PCH"
kind = "chipset"
rect = [72.2, 75.4, 85.0, 88.0]
label = "B650"
part = "AMD B650 chipset (PCIe 4.0 x4 uplink)"
bind = "temp:PCH"

[[component]]
id = "SATA_12"
kind = "sata"
rect = [94.0, 84.0, 99.6, 91.0]
label = "SATA1/2"
part = "2× SATA 6Gb/s (stacked, B650)"
bind = "sata:1,2"

[[component]]
id = "SATA_4"
kind = "sata"
rect = [80.7, 95.4, 86.5, 98.3]
